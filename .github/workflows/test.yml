name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile || bun install
      - run: bun test tests/

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax check
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(install.sh scripts/**/*.sh scripts/*.sh *.sh)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no shell files found"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "checking $f"
            bash -n "$f"
          done
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          severity: warning
