name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Split by file duration (tests/timings.json) across parallel jobs; Actions minutes are free on a public repo.
  test:
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install bsdtar for the install.ps1 zip tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools
      - name: Download and verify the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(cat packaging/VERSION)"
          assets="$RUNNER_TEMP/assets"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -D "$assets"
          (cd "$assets" && sha256sum -c SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/snipset"
          tar -xzf "$assets/snipset-cli-$tag-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP/snipset"
          echo "$RUNNER_TEMP/snipset" >> "$GITHUB_PATH"
          echo "SNIPSET_REAL_ASSETS=$assets" >> "$GITHUB_ENV"
          # v0.2.0 is the install that tests/install-update-real.test.mjs updates from.
          prev="$RUNNER_TEMP/assets-prev"
          gh release download v0.2.0 -R "$GITHUB_REPOSITORY" -D "$prev"
          (cd "$prev" && sha256sum -c SHA256SUMS)
          echo "SNIPSET_PREV_ASSETS=$prev" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile || bun install
      - run: bun test --shard=${{ matrix.shard }}/4 --timings=tests/timings.json tests/

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: install.sh and install.ps1 match their parts
        run: bun scripts/installer/build.mjs --check
      - name: Packaging manifests match their templates
        run: bun scripts/packaging/render.mjs --check

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax check
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(install.sh scripts/**/*.sh scripts/*.sh *.sh)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no shell files found"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "checking $f"
            bash -n "$f"
          done
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          severity: warning

  psscriptanalyzer:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Run PSScriptAnalyzer
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          $found = foreach ($file in 'install.ps1', 'tests/install.Tests.ps1') {
            Invoke-ScriptAnalyzer -Path $file -Settings ./PSScriptAnalyzerSettings.psd1
          }
          $found | Format-Table ScriptName, Line, Severity, RuleName, Message -AutoSize -Wrap
          if ($found) { throw "PSScriptAnalyzer: $(@($found).Count) findings" }

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Contract check
        run: ./tests/install.Tests.ps1
      # The runner image installs OpenSSL into System32 (actions/runner-images#13198), which hid v0.2.0's missing DLLs.
      - name: Remove the runner's OpenSSL DLLs from System32
        run: |
          $sys = Join-Path $env:SystemRoot 'System32'
          $patterns = (Join-Path $sys 'libcrypto-*.dll'), (Join-Path $sys 'libssl-*.dll')
          Get-ChildItem -Path $patterns | ForEach-Object { Write-Output "removing $($_.FullName)"; Remove-Item -LiteralPath $_.FullName -Force }
          if (Get-ChildItem -Path $patterns) { throw 'OpenSSL DLLs are still in System32' }
      # Negative control: v0.2.0 imports libcrypto-3-x64.dll, so it must stop at load with 0xC0000135 (STATUS_DLL_NOT_FOUND).
      - name: v0.2.0 cannot start with only System32, Windows and its own dir on PATH
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = 'snipset-cli-v0.2.0-x86_64-pc-windows-msvc.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'snipset-v0.2.0'
          gh release download v0.2.0 -R $env:GITHUB_REPOSITORY -p $zip -D $env:RUNNER_TEMP
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP $zip) -DestinationPath $dir
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$dir"
          & (Join-Path $dir 'snipset.exe') --version
          if ($LASTEXITCODE -ne -1073741515) { throw "expected exit -1073741515 (STATUS_DLL_NOT_FOUND), got $LASTEXITCODE" }
          # The runner ends a pwsh or powershell step with $LASTEXITCODE, which still holds the expected failure.
          exit 0
      # The real one-liner path: install.ps1 downloads the public release and checks it against SHA256SUMS.
      - name: Install, check, run, and uninstall the published release
        run: |
          $tag = 'v' + (Get-Content -Raw packaging/VERSION).Trim()
          $dir = Join-Path $env:RUNNER_TEMP 'snipset-bin'
          # No OpenSSL from Git or the runner's OpenSSL install on PATH can stand in for a missing DLL.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$dir"
          ./install.ps1 -Version $tag -InstallDir $dir
          ./install.ps1 -Version $tag -InstallDir $dir -Check
          $out = & (Join-Path $dir 'snipset.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "snipset --version exited $LASTEXITCODE" }
          $want = 'snipset ' + ($tag -replace '^v', '')
          if ($out -notmatch [regex]::Escape($want)) { throw "expected '$want', got '$out'" }
          ./install.ps1 -InstallDir $dir -Uninstall
          if (Test-Path -LiteralPath (Join-Path $dir 'snipset.exe')) { throw 'snipset.exe is still there after -Uninstall' }

  scoop:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      # The runner user is an administrator, which the Scoop installer refuses without -RunAsAdmin.
      - name: Install Scoop
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          Join-Path $env:USERPROFILE 'scoop\shims' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Install the bucket manifest from this checkout
        # A relative path reads as <bucket>/<app> (bucket '.'); an absolute path is a local manifest.
        run: |
          scoop install (Resolve-Path .\bucket\snipset.json).Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove the runner's OpenSSL DLLs from System32
        run: |
          $sys = Join-Path $env:SystemRoot 'System32'
          $patterns = (Join-Path $sys 'libcrypto-*.dll'), (Join-Path $sys 'libssl-*.dll')
          Get-ChildItem -Path $patterns | ForEach-Object { Write-Output "removing $($_.FullName)"; Remove-Item -LiteralPath $_.FullName -Force }
          if (Get-ChildItem -Path $patterns) { throw 'OpenSSL DLLs are still in System32' }
      - name: snipset --version with only System32, Windows and the Scoop shims on PATH
        timeout-minutes: 5
        run: |
          $want = 'snipset ' + (Get-Content -Raw packaging/VERSION).Trim()
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;" + (Join-Path $env:USERPROFILE 'scoop\shims')
          $out = snipset --version
          if ($LASTEXITCODE -ne 0) { throw "snipset --version exited $LASTEXITCODE" }
          if (-not "$out".StartsWith($want)) { throw "expected '$want', got '$out'" }

  aur:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install git, unzip, shellcheck, and gh
        run: pacman -Syu --noconfirm --needed git unzip shellcheck github-cli
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Download and verify the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=/tmp/snipset-assets
          gh release download "v$(cat packaging/VERSION)" -R "$GITHUB_REPOSITORY" -D "$assets"
          (cd "$assets" && sha256sum -c SHA256SUMS)
          chmod -R a+rX "$assets"
          echo "SNIPSET_REAL_ASSETS=$assets" >> "$GITHUB_ENV"
      # makepkg refuses to run as root.
      - name: makepkg tests as a regular user
        run: |
          useradd -m builder
          install -Dm755 "$(command -v bun)" /usr/local/bin/bun
          chown -R builder: .
          su builder -c "SNIPSET_REAL_ASSETS='$SNIPSET_REAL_ASSETS' bun test tests/packaging-aur.test.mjs tests/install-real-assets.test.mjs"

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Leaves the out-link ./result, whose bin/snipset the next step runs.
      - name: nix build
        run: nix build .#default
      - name: nix flake check and the built snipset --version
        env:
          SNIPSET_NIX_CHECK: "1"
          SNIPSET_NIX_BUILD: "1"
        run: bun test tests/packaging-nix.test.mjs

  homebrew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A local tap holds this checkout's formula; brew downloads the public tarball and checks its sha256.
      - name: Install, test, and audit the formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap-new --no-git local/snipset
          cp Formula/snipset.rb "$(brew --repository local/snipset)/Formula/"
          brew install --formula local/snipset/snipset
          brew test local/snipset/snipset
          brew audit --strict --formula local/snipset/snipset

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # No macOS build is published, so install.sh must stop with a clear message under both the stock
      # bash 3.2 and a current bash, instead of failing on syntax or a missing tool.
      - name: install.sh refuses macOS cleanly
        run: |
          set -euo pipefail
          version="v$(cat packaging/VERSION)"
          expect() {
            local bash_bin=$1 want=$2 out rc
            out=$("$bash_bin" install.sh --version "$version" --dry-run 2>&1) && rc=0 || rc=$?
            echo "$bash_bin -> exit $rc: $out"
            [ "$rc" -eq 1 ] || { echo "expected exit 1"; return 1; }
            grep -qF "$want" <<<"$out" || { echo "expected: $want"; return 1; }
          }
          brew list bash >/dev/null 2>&1 || brew install bash
          expect /bin/bash 'bash 4.4 or newer is required'
          expect "$(brew --prefix)/bin/bash" 'no macOS build is published yet'
